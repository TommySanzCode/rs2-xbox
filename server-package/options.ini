# Stop the server before changing these settings, then run Start-Server.cmd.
# Use auto to select this PC's LAN address, or enter its LAN IPv4 address.
server_address = auto
game_port = 43594

# Members content: 1 enables it; 0 selects a free world.
members = 1
# Whole-number experience multiplier; 1 uses the original rate.
xp_rate = 1

# Use a separate local game account in the generated Xbox configuration.
# These fields are plaintext. Keep customized options and configuration private.
account_username =
account_password =
