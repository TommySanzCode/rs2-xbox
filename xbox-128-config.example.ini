# Experimental 128 MB Xbox client. Requires a BIOS exposing expanded memory.
# Copy to config.ini beside this build's default.xbe and edit locally.
socketip = 127.0.0.1
portoff = 0
nodeid = 1
# 0 enables original high-detail textures, animated textures, music and effects.
# 1 disables these features for performance comparisons.
lowmem = 0

username =
password =
remember_username = 1
remember_password = 1
# rsa_exponent =
# rsa_modulus =

# 480 is compatible with SD TVs. 720 requests 720p and falls back to 480 if
# unavailable. Requires suitable video hardware/cabling and dashboard settings.
# This changes output resolution; the original game viewport stays the same.
xbox_video = 480
# Set audio to 0 for silent testing, or music to 0 to keep only sound effects.
xbox_audio = 1
xbox_music = 1

show_performance = 1
chat_era = 2
allow_commands = 0
allow_debugprocs = 0
