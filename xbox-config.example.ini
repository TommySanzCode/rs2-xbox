# Native RuneScape 2 revision 225, original Xbox with 64 MB RAM.
# Copy to rom/config.ini and edit locally before rebuilding or deploying.
# Replace 127.0.0.1 with the compatible server computer's LAN IPv4 address.
socketip = 127.0.0.1
portoff = 0
nodeid = 1
lowmem = 1

# This initial Xbox port has no text-entry UI. Use a separate account on your
# historical server; fill these locally if testing login. Keep them private.
username =
password =
# Retain these fields in memory after logout so Start can log in again.
# These flags do not write credentials to disk.
remember_username = 1
remember_password = 1

# Keep the client's built-in RSA public key unless your server uses another.
# rsa_exponent =
# rsa_modulus =

show_performance = 1
chat_era = 2
allow_commands = 0
allow_debugprocs = 0
